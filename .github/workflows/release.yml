name: Test, Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Go Unit & OTLP Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test -race -v ./...

  release:
    name: Build Static Binaries & Multi-Arch Container
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Cross-compile zero-CGO static binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for pair in "linux amd64" "linux arm64" "darwin arm64" "darwin amd64" "windows amd64"; do
            set -- $pair
            GOOS=$1 GOARCH=$2
            EXT=""
            [ "$GOOS" = "windows" ] && EXT=".exe"
            BIN="otelping-probe_${VERSION}_${GOOS}_${GOARCH}${EXT}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${BIN}" ./cmd/otelping-probe
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/otelping/otelping-probe:${{ github.ref_name }}
            ghcr.io/otelping/otelping-probe:latest
